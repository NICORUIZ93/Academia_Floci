name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: |
          cd web
          npm ci
      - name: Build web
        run: |
          cd web
          npm run build --silent
      - name: Test web
        run: |
          cd web
          npm test -- --watch=false
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Validate repository
        run: ./scripts/validate.sh
      - name: Run lessons check
        run: |
          python3 scripts/fix_lessons.py --check --skip-http
        shell: bash
