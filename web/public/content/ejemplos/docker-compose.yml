services:
  aws-local:
    image: floci/floci:1.5.22-compat
    ports:
      - "4566:4566"
    environment:
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "aws sts get-caller-identity >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
