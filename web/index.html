<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Academia Master Hacker</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Ruta profesional de cero a avanzado</p>
      <h1>Academia Master Hacker</h1>
    </div>
    <div class="progress-box" aria-live="polite">
      <span id="progressLabel">Paso 1 de 45</span>
      <progress id="progressBar" value="1" max="45"></progress>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" aria-label="Cursos">
      <div class="sidebar-header">
        <h2>Cursos</h2>
        <button id="resetProgress" class="ghost-button" type="button">Reiniciar</button>
      </div>
      <div id="courseList" class="course-list"></div>
    </nav>

    <main class="lesson" tabindex="-1">
      <p id="courseLabel" class="course-label"></p>
      <h2 id="lessonTitle">Cargando...</h2>
      <p id="lessonText" class="lesson-text"></p>
      <p id="lessonHint" class="lesson-hint"></p>

      <section class="panel method-panel">
        <h3>Objetivo</h3>
        <p id="objectiveText"></p>
      </section>

      <section class="panel">
        <h3>Teoria</h3>
        <p id="theoryText"></p>
      </section>

      <section id="commandPanel" class="panel">
        <div class="panel-header">
          <h3>Practica</h3>
          <button id="copyCommand" type="button">Copiar practica</button>
        </div>
        <pre><code id="commandText"></code></pre>
        <p id="copyStatus" class="status-text"></p>
      </section>

      <section class="panel">
        <h3>Aprenderas</h3>
        <ul id="breakdownList"></ul>
      </section>

      <section class="panel">
        <h3>Profundizacion</h3>
        <p id="deepDiveText"></p>
      </section>

      <section class="panel">
        <h3>Errores comunes</h3>
        <ul id="errorsList"></ul>
      </section>

      <section class="panel">
        <h3>Reto</h3>
        <p id="challengeText"></p>
      </section>

      <section class="panel">
        <h3>Resultado esperado</h3>
        <pre><code id="expectedOutput"></code></pre>
      </section>

      <section class="panel">
        <h3>Recursos</h3>
        <ul id="resourcesList"></ul>
      </section>

      <section class="panel check-panel">
        <h3>Pregunta de control</h3>
        <p id="controlQuestion"></p>
      </section>

      <div class="actions">
        <button id="previousStep" type="button">Anterior</button>
        <button id="completeStep" class="primary-button" type="button">Marcar completado</button>
        <button id="nextStep" type="button">Siguiente</button>
      </div>
    </main>

    <aside class="outline" aria-label="Temario">
      <h2 id="outlineTitle">Temario</h2>
      <ol id="lessonList" class="lesson-list"></ol>
      <p id="sourceStatus" class="status-text"></p>
    </aside>
  </div>

  <script src="app-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
