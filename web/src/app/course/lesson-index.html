<nav class="lesson-index" aria-label="Índice del curso">
  <label class="topic-search">
    <span>Buscar en este track</span>
    <input type="search" placeholder="Ej. mapas, seguridad, Riverpod…" [value]="topicQuery()" (input)="updateQuery($event)" />
  </label>
  <div class="lesson-index-group" *ngFor="let group of groups()">
    <span class="lesson-index-level">{{ group.level }}</span>
    <div class="module-entry" *ngFor="let module of group.modules" [hidden]="!moduleMatches(module)">
      <a
        class="lesson-index-item"
        [class.done]="status(module.id) === 'done'"
        [class.current]="status(module.id) === 'current'"
        [routerLink]="['/curso', trackId, module.id]"
        routerLinkActive="active"
      >
        <span class="status-dot" [class.done]="status(module.id) === 'done'" [class.current]="status(module.id) === 'current'" [class.pending]="status(module.id) === 'pending'" aria-hidden="true"></span>
        <span class="sr-only">{{ status(module.id) === 'done' ? 'Completado' : status(module.id) === 'current' ? 'Módulo actual' : 'Pendiente' }}</span>
        <span class="lesson-index-title">{{ module.shortTitle }}</span>
        <span class="topic-count">{{ topicIndex.topics(trackId, module.id).length }}</span>
      </a>
      <details class="module-topics" [open]="topicQuery().length > 0 || status(module.id) === 'current'">
        <summary>Ver temas</summary>
        <a
          *ngFor="let topic of topics(module.id)"
          [routerLink]="['/curso', trackId, module.id]"
          [fragment]="topic.fragment"
          [title]="topic.title"
        >{{ topic.title }}</a>
      </details>
    </div>
  </div>

  <a class="lesson-index-item lesson-index-quiz" [routerLink]="['/curso', trackId, 'quiz']" routerLinkActive="active">
    <lucide-icon [img]="icons.CircleQuestionMark" />
    <span class="lesson-index-title">Cuestionario final</span>
  </a>
</nav>
