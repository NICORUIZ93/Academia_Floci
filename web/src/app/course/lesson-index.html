<nav class="lesson-index" aria-label="Índice del curso">
  <div class="lesson-index-group" *ngFor="let group of groups()">
    <span class="lesson-index-level">{{ group.level }}</span>
    <a
      *ngFor="let module of group.modules"
      class="lesson-index-item"
      [class.done]="status(module.id) === 'done'"
      [class.current]="status(module.id) === 'current'"
      [routerLink]="['/curso', trackId, module.id]"
      routerLinkActive="active"
    >
      <span class="status-dot" [class.done]="status(module.id) === 'done'" [class.current]="status(module.id) === 'current'" [class.pending]="status(module.id) === 'pending'" aria-hidden="true"></span>
      <span class="sr-only">{{ status(module.id) === 'done' ? 'Completado' : status(module.id) === 'current' ? 'Módulo actual' : 'Pendiente' }}</span>
      <span class="lesson-index-title">{{ module.shortTitle }}</span>
    </a>
  </div>
</nav>
