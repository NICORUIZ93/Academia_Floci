<div class="catalog-page">
  <header class="catalog-topbar">
    <a class="brand" routerLink="/">
      <span class="brand-mark"><lucide-icon [img]="brandIcon" /></span>
      <span>
        <strong>Academia Floci</strong>
        <small>Biblioteca de cursos</small>
      </span>
    </a>
    <button class="theme-toggle" (click)="themeService.toggle()" [title]="themeService.isDark() ? 'Modo claro' : 'Modo oscuro'">
      <lucide-icon [img]="themeService.isDark() ? icons.Sun : icons.Moon" />
    </button>
  </header>

  <main>
    <section class="tracks-section">
      <div class="track-group" *ngFor="let group of trackGroups()">
        <h2>{{ group.title }}</h2>

        <div class="catalog-grid">
          <article class="track-card" *ngFor="let card of group.cards" [style.--track-color]="card.color">
            <a class="track-card-main" [routerLink]="['/curso', card.id]">
              <div class="track-card-icon"><lucide-icon [img]="card.icon" /></div>
              <div>
                <h4>{{ card.name }}</h4>
                <p>{{ card.tagline }}</p>
              </div>
            </a>

            <div class="track-card-meta">
              <span>{{ card.moduleCount }} módulos</span>
              <span>{{ card.totalHours }}</span>
              <span>{{ card.percent }}%</span>
            </div>
            <div class="track-card-progress"><span [style.width.%]="card.percent"></span></div>
            <p class="track-levels">{{ card.levels }}</p>

            <details class="track-topics">
              <summary>Temas del curso</summary>
              <ol>
                <li *ngFor="let module of card.modules">{{ module }}</li>
              </ol>
            </details>

            <div class="track-outcome">
              <strong>Entregable</strong>
              <p>{{ card.outcome }}</p>
            </div>
          </article>
        </div>
      </div>
    </section>
  </main>
</div>
