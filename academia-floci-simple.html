<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Academia Floci</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      background: #ffffff;
      color: #1a1a1a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 18px;
      line-height: 1.6;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #1a1a1a;
      overflow-x: hidden;
    }

    button {
      font: inherit;
      color: #1a1a1a;
      background: #ffffff;
      border: 1px solid #1a1a1a;
      border-radius: 0;
      padding: 10px 16px;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      background: #f0f0f0;
    }

    button:disabled {
      color: #777777;
      border-color: #cccccc;
      cursor: not-allowed;
      background: #ffffff;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 24px 40px;
      border-bottom: 1px solid #dddddd;
      background: #ffffff;
    }

    .brand {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }

    .progress {
      font-weight: 700;
      white-space: nowrap;
    }

    .layout {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 40px;
      align-items: start;
    }

    main {
      min-width: 0;
    }

    aside {
      min-width: 0;
      border-left: 1px solid #dddddd;
      padding-left: 32px;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 36px;
      line-height: 1.2;
      letter-spacing: 0;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    h2 {
      margin: 36px 0 12px;
      font-size: 22px;
      line-height: 1.3;
      letter-spacing: 0;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    p {
      margin: 0 0 18px;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    ul {
      margin: 0;
      padding-left: 24px;
    }

    li {
      margin: 8px 0;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .step-box {
      margin-top: 28px;
    }

    .command-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 36px 0 12px;
    }

    .command-header h2 {
      margin: 0;
    }

    pre {
      margin: 0;
      padding: 20px;
      max-width: 100%;
      background: #f0f0f0;
      color: #1a1a1a;
      border: 1px solid #dddddd;
      border-radius: 0;
      overflow-x: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 16px;
      line-height: 1.55;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 0.95em;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .question {
      border-left: 4px solid #1a1a1a;
      padding-left: 18px;
      margin-top: 36px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid #dddddd;
    }

    .nav-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .done-button {
      border-color: #0f7a34;
      color: #0f7a34;
      font-weight: 700;
    }

    .done-button:hover,
    .done-button:focus-visible {
      background: #eaf7ee;
    }

    .side-title {
      margin: 0 0 16px;
      font-size: 20px;
      line-height: 1.3;
    }

    .steps-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .steps-list button {
      width: 100%;
      min-width: 0;
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      text-align: left;
      border: 0;
      border-left: 4px solid transparent;
      padding: 10px 8px;
      background: #ffffff;
    }

    .steps-list span {
      min-width: 0;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .steps-list button:hover,
    .steps-list button:focus-visible {
      background: #f0f0f0;
    }

    .steps-list .completed {
      color: #0f7a34;
    }

    .steps-list .active {
      border-left-color: #005bbb;
      color: #005bbb;
      font-weight: 700;
    }

    .status-text {
      margin-top: 16px;
      color: #555555;
      font-size: 16px;
    }

    .copy-status {
      min-height: 24px;
      margin-top: 8px;
      color: #555555;
      font-size: 16px;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 860px) {
      .topbar {
        padding: 20px;
        align-items: flex-start;
        flex-direction: column;
      }

      .layout {
        grid-template-columns: 1fr;
        width: 100%;
        padding: 28px 20px;
      }

      aside {
        border-left: 0;
        border-top: 1px solid #dddddd;
        padding-left: 0;
        padding-top: 28px;
      }

      h1 {
        font-size: 30px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <p class="brand">Academia Floci</p>
    <p id="progress" class="progress">Paso 1 de 45</p>
  </header>

  <div class="layout">
    <main>
      <article>
        <h1 id="stepTitle">Paso 1: Cargando...</h1>

        <section class="step-box">
          <p id="explanation"></p>
          <p id="analogy"></p>
        </section>

        <section id="commandSection">
          <div class="command-header">
            <h2>Comando</h2>
            <button id="copyButton" type="button">Copiar</button>
          </div>
          <pre><code id="commandText"></code></pre>
          <p id="copyStatus" class="copy-status"></p>
        </section>

        <section id="breakdownSection">
          <h2>Desglose del comando</h2>
          <ul id="breakdownList"></ul>
        </section>

        <section>
          <h2>Salida esperada</h2>
          <pre><code id="expectedOutput"></code></pre>
        </section>

        <section id="questionSection" class="question">
          <h2>Pregunta de control</h2>
          <p id="questionText"></p>
        </section>

        <div class="actions">
          <button id="doneButton" class="done-button" type="button">✅ Ya lo ejecuté</button>
          <div class="nav-buttons">
            <button id="prevButton" type="button">← Anterior</button>
            <button id="nextButton" type="button">Siguiente →</button>
          </div>
        </div>
      </article>
    </main>

    <aside>
      <h2 class="side-title">Ruta visible</h2>
      <ul id="visibleSteps" class="steps-list"></ul>
      <p id="statusText" class="status-text"></p>
    </aside>
  </div>

  <script>
    const STORAGE_KEY = "academia-floci-paso-actual";

    const steps = [
      {
        number: 1,

        explanation: "Docker permite ejecutar aplicaciones empaquetadas en contenedores. Para este curso lo usamos porque Floci necesita correr aislado, con sus puertos y archivos controlados, sin instalar servicios cloud reales en tu computador.",
        analogy: "Piensa en Docker como una lonchera técnica: adentro viene la aplicación con todo lo que necesita para funcionar igual en Mac, Windows o Linux.",
        command: "",
        breakdown: [
          "No hay comando en este paso.",
          "Docker es la base para ejecutar Floci localmente.",
          "Un contenedor es una aplicación corriendo de forma aislada.",
          "Una imagen es la plantilla desde donde nace el contenedor."

        breakdown: [
          "En Mac: instala Docker Desktop desde docker.com, abre la aplicación y espera a que diga que está corriendo.",
          "En Windows: instala Docker Desktop, activa WSL si el instalador lo pide, abre Docker Desktop y espera el estado listo.",
          "En Linux: instala Docker con tu gestor de paquetes; por ejemplo, sudo apt install docker.io en Ubuntu.",
          "curl -fsSL https://floci.io/install.sh | sh instala floci-cli en Mac o Linux.",
          "irm https://floci.io/install.ps1 | iex instala floci-cli desde PowerShell en Windows.",
          "docker --version confirma que la terminal puede encontrar Docker.",
          "floci doctor revisa que el ambiente esté listo para usar Floci."

        expected: "Docker version 24.0.7, build afdd53b\nFloci doctor OK",

      },
      {

        analogy: "Floci funciona como una maqueta de ciudad: no es la ciudad real, pero te permite aprender calles, reglas y movimientos sin peligro.",
        command: "# Mac / Linux\nfloci start\n\n# Windows PowerShell\nfloci start\n\n# Alternativa con Docker\ndocker run --rm -p 4566:4566 -v /var/run/docker.sock:/var/run/docker.sock floci/floci:latest",

          "floci llama a la CLI de Floci.",

          "Floci AWS escucha normalmente en http://localhost:4566.",

          "floci/floci:latest es la imagen Docker del emulador AWS."

        expected: "Floci started\nAWS emulator listening on http://localhost:4566",
        question: "¿Qué ventaja tiene levantar Floci localmente en vez de usar una cuenta cloud real para aprender?"
      },
      {
        number: 4,
        title: "Verificar Floci",
        explanation: "No basta con iniciar un programa. Debes comprobar que responde. Este paso valida que el endpoint local de Floci está vivo antes de crear recursos.",
        analogy: "Es como tocar el timbre antes de entrar: primero confirmas que hay alguien respondiendo.",
        command: "floci doctor\ncurl http://localhost:4566/_localstack/health",
        breakdown: [
          "floci doctor revisa el ambiente y muestra problemas comunes.",
          "curl hace una petición HTTP desde la terminal.",
          "localhost significa tu propio computador.",
          "4566 es el puerto local compatible con herramientas AWS.",

        expected: "Floci doctor OK\n{\"services\":{\"s3\":\"available\",\"sqs\":\"available\",\"lambda\":\"available\"}}",
        question: "¿Qué palabra te indica que un servicio está listo?"
      },
      {
        number: 5,
        title: "Configurar AWS CLI",
        explanation: "AWS CLI necesita credenciales aunque trabajes local. En Floci puedes usar valores ficticios porque no vas a autenticar contra AWS real.",

        command: "# Mac / Linux\nfloci env\neval $(floci env)\n\n# Windows PowerShell\nfloci env | Invoke-Expression\n\n# Alternativa manual\nexport AWS_ENDPOINT_URL=http://localhost:4566\nexport AWS_ACCESS_KEY_ID=test\nexport AWS_SECRET_ACCESS_KEY=test",

        expected: "Sin salida si la configuración se guarda correctamente.",
        question: "¿Por qué no debes usar claves reales en este laboratorio?"
      },
      {
        number: 6,
        title: "Probar AWS CLI con Floci",
        explanation: "Este paso confirma que la CLI está hablando con Floci. Al inicio no deberías ver recursos porque todavía no has creado nada.",
        analogy: "Es como abrir una bodega vacía: que no haya cajas no significa que la puerta falle.",
        command: "aws s3 ls --endpoint-url http://localhost:4566",
        breakdown: [
          "aws s3 ls lista buckets de S3.",

          "http://localhost:4566 apunta a Floci local.",

        expected: "Sin salida si todavía no existen buckets.",

      {

          "s3://mi-bucket es el nombre del bucket.",

        expected: "make_bucket: mi-bucket",

      {
        number: 9,
        title: "Crear y subir un archivo",
        explanation: "Vas a crear un archivo local y luego copiarlo al bucket. Así verificas el flujo completo: tu disco local hacia almacenamiento S3 local.",

        command: "echo \"Hola Mundo\" > miarchivo.txt\naws s3 cp miarchivo.txt s3://mi-bucket/ --endpoint-url http://localhost:4566",
        breakdown: [
          "echo crea texto desde la terminal.",
          "> miarchivo.txt guarda ese texto en un archivo.",
          "aws s3 cp copia archivos.",
          "miarchivo.txt es el origen local.",
          "s3://mi-bucket/ es el destino en S3."

        expected: "upload: ./miarchivo.txt to s3://mi-bucket/miarchivo.txt",
        question: "¿Qué comando sube el archivo al bucket?"

      {
        number: 10,
        title: "Listar objetos",
        explanation: "Después de subir, debes comprobar que el objeto existe. Listar es la forma más simple de obtener evidencia.",

          "--endpoint-url mantiene la consulta local.",

        expected: "2026-07-01 12:00:00         11 miarchivo.txt",

    let progressStepNumber = readProgress();
    let viewStepNumber = Math.min(progressStepNumber, steps.length);

    const progressEl = document.getElementById("progress");
    const stepTitleEl = document.getElementById("stepTitle");
    const explanationEl = document.getElementById("explanation");
    const analogyEl = document.getElementById("analogy");
    const commandSectionEl = document.getElementById("commandSection");
    const commandTextEl = document.getElementById("commandText");
    const copyButtonEl = document.getElementById("copyButton");
    const copyStatusEl = document.getElementById("copyStatus");
    const breakdownListEl = document.getElementById("breakdownList");
    const expectedOutputEl = document.getElementById("expectedOutput");
    const questionSectionEl = document.getElementById("questionSection");
    const questionTextEl = document.getElementById("questionText");
    const doneButtonEl = document.getElementById("doneButton");
    const prevButtonEl = document.getElementById("prevButton");
    const nextButtonEl = document.getElementById("nextButton");
    const visibleStepsEl = document.getElementById("visibleSteps");
    const statusTextEl = document.getElementById("statusText");

    function readProgress() {
      const value = Number(window.localStorage.getItem(STORAGE_KEY));

      if (!Number.isInteger(value) || value < 1) {
        return 1;
      }

      if (value > steps.length + 1) {
        return steps.length + 1;
      }

      return value;
    }

    function saveProgress() {
      window.localStorage.setItem(STORAGE_KEY, String(progressStepNumber));
    }

    function currentStep() {
      return steps[viewStepNumber - 1];
    }

    function render() {
      const step = currentStep();

      progressEl.textContent = `Paso ${step.number} de ${steps.length}`;
      stepTitleEl.textContent = `Paso ${step.number}: ${step.title}`;
      explanationEl.textContent = step.explanation;
      analogyEl.textContent = step.analogy;
      copyStatusEl.textContent = "";

      if (step.command) {
        commandSectionEl.classList.remove("hidden");
        commandTextEl.textContent = step.command;
      } else {
        commandSectionEl.classList.add("hidden");
        commandTextEl.textContent = "";
      }

      breakdownListEl.innerHTML = "";
      step.breakdown.forEach((item) => {
        const li = document.createElement("li");
        li.textContent = item;
        breakdownListEl.appendChild(li);
      });

      expectedOutputEl.textContent = step.expected;

      if (step.question) {
        questionSectionEl.classList.remove("hidden");
        questionTextEl.textContent = step.question;
      } else {
        questionSectionEl.classList.add("hidden");
        questionTextEl.textContent = "";
      }

      prevButtonEl.disabled = viewStepNumber === 1;
      nextButtonEl.disabled = viewStepNumber === steps.length;

      const allDone = progressStepNumber > steps.length;
      doneButtonEl.disabled = allDone && viewStepNumber === steps.length;
      doneButtonEl.textContent = allDone && viewStepNumber === steps.length ? "Curso completado" : "✅ Ya lo ejecuté";

      renderVisibleSteps();
      renderStatus();
    }

    function renderVisibleSteps() {
      const totalVisible = 5;
      const maxStart = Math.max(0, steps.length - totalVisible);
      const centeredStart = viewStepNumber - 3;
      const start = Math.min(Math.max(0, centeredStart), maxStart);
      const visible = steps.slice(start, start + totalVisible);

      visibleStepsEl.innerHTML = "";

      visible.forEach((step) => {
        const item = document.createElement("li");
        const button = document.createElement("button");
        const symbol = document.createElement("span");
        const label = document.createElement("span");
        const isCompleted = step.number < progressStepNumber;
        const isActive = step.number === viewStepNumber;

        button.type = "button";
        button.className = `${isCompleted ? "completed" : ""} ${isActive ? "active" : ""}`.trim();
        symbol.textContent = isCompleted ? "✓" : isActive ? "●" : "○";
        label.textContent = `Paso ${step.number}: ${step.title}`;

        button.appendChild(symbol);
        button.appendChild(label);
        button.addEventListener("click", () => {
          viewStepNumber = step.number;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });

        item.appendChild(button);
        visibleStepsEl.appendChild(item);
      });
    }

    function renderStatus() {
      if (progressStepNumber > steps.length) {
        statusTextEl.textContent = "Todos los pasos están completados.";
        return;
      }

      statusTextEl.textContent = `Primer paso pendiente: ${progressStepNumber}.`;
    }

    async function copyCommand() {
      const command = currentStep().command;

      if (!command) {
        return;
      }

      try {
        await navigator.clipboard.writeText(command);
        copyStatusEl.textContent = "Comando copiado.";
      } catch (error) {
        const textarea = document.createElement("textarea");
        textarea.value = command;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
        copyStatusEl.textContent = "Comando copiado.";
      }
    }

    function completeStep() {
      if (viewStepNumber >= progressStepNumber) {
        progressStepNumber = Math.min(viewStepNumber + 1, steps.length + 1);
        saveProgress();
      }

      if (viewStepNumber < steps.length) {
        viewStepNumber += 1;
      }

      if (progressStepNumber <= steps.length) {
        viewStepNumber = Math.max(viewStepNumber, progressStepNumber);
      }

      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function goPrevious() {
      if (viewStepNumber > 1) {
        viewStepNumber -= 1;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    function goNext() {
      if (viewStepNumber < steps.length) {
        viewStepNumber += 1;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    copyButtonEl.addEventListener("click", copyCommand);
    doneButtonEl.addEventListener("click", completeStep);
    prevButtonEl.addEventListener("click", goPrevious);
    nextButtonEl.addEventListener("click", goNext);

    render();
  </script>
</body>
</html>
