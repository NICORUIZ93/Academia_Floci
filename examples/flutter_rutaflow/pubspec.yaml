name: flutter_rutaflow
description: RutaFlow delivery app demonstrating Flutter best practices.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  dio: ^5.3.0
  json_serializable: ^6.7.0
  json_annotation: ^4.8.0
  intl: ^0.19.0
  google_maps_flutter: ^2.5.0
  geolocator: ^9.0.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
