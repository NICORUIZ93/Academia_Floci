apiVersion: apps/v1
kind: Deployment
metadata:
  name: rutaflow-delivery-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: rutaflow-delivery-api }
  template:
    metadata:
      labels: { app: rutaflow-delivery-api }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: registry.example/rutaflow-delivery@sha256:REPLACE_WITH_VERIFIED_DIGEST
          ports: [{ name: http, containerPort: 8080 }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
          readinessProbe: { httpGet: { path: /ready, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /live, port: http }, periodSeconds: 10 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
