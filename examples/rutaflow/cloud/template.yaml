AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Resources:
  DeliveryCommands:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeliveryCommandsDLQ.Arn
        maxReceiveCount: 5
  DeliveryCommandsDLQ:
    Type: AWS::SQS::Queue
    Properties: { MessageRetentionPeriod: 1209600 }
  ShipmentEvents:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: shipmentId, AttributeType: S }
        - { AttributeName: sequence, AttributeType: N }
      KeySchema:
        - { AttributeName: shipmentId, KeyType: HASH }
        - { AttributeName: sequence, KeyType: RANGE }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
