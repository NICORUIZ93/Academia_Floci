AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Resources:
  DeliveryCommands:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeliveryCommandsDLQ.Arn
        maxReceiveCount: 5
  DeliveryCommandsDLQ:
    Type: AWS::SQS::Queue
    Properties: { MessageRetentionPeriod: 1209600 }
  ShipmentEvents:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: shipmentId, AttributeType: S }
        - { AttributeName: sequence, AttributeType: N }
        - { AttributeName: estado, AttributeType: S }
      KeySchema:
        - { AttributeName: shipmentId, KeyType: HASH }
        - { AttributeName: sequence, KeyType: RANGE }
      # GSI real usado en el Módulo 4 (DynamoDB), Tema 5 — permite "todos los envíos con
      # estado=entregado" sin conocer el shipmentId de antemano, algo que la clave primaria
      # (shipmentId + sequence) no permite por sí sola.
      GlobalSecondaryIndexes:
        - IndexName: EstadoIndex
          KeySchema:
            - { AttributeName: estado, KeyType: HASH }
            - { AttributeName: sequence, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
  # Pruebas de entrega (fotos) que el conductor sube al cerrar un envío — ver Módulo 2
  # (Cloud) para el ciclo completo de metadatos, versionado, ciclo de vida y URLs
  # pre-firmadas aplicado sobre este mismo bucket.
  PruebasEntrega:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: mover-pruebas-entrega-a-infrecuente
            Status: Enabled
            Prefix: envio-
            Transitions:
              - { TransitionInDays: 30, StorageClass: STANDARD_IA }
  # Consume DeliveryCommands (Módulo 3) y escribe el evento resultante en ShipmentEvents
  # (Módulo 4) — ver Módulo 5 (Lambda), Tema 6, para el flujo completo end-to-end.
  ConfirmarEntregaFn:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      CodeUri: functions/confirmar-entrega/
      Environment:
        Variables:
          TABLE_NAME: !Ref ShipmentEvents
      Events:
        DeliveryCommand:
          Type: SQS
          Properties:
            Queue: !GetAtt DeliveryCommands.Arn
            BatchSize: 5
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref ShipmentEvents
