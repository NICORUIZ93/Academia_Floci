# CI — pipelines automatizados (Módulo 4): build, test y push de imagen Docker
# en GitHub Actions, con cache de dependencias.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # cachea node_modules entre runs basándose en package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --coverage

  build-and-push:
    needs: test # solo corre si el job `test` pasó — no se publica una imagen sin tests verdes
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # solo en main, no en cada PR
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          # cache-from/cache-to: reutiliza capas de builds anteriores entre
          # ejecuciones del pipeline, no solo dentro de un mismo build.
          cache-from: type=gha
          cache-to: type=gha,mode=max
