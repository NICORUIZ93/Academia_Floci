# Kubernetes — fundamentos (Módulo 6): Deployment + Service + probes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tareas-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tareas-api
  template:
    metadata:
      labels:
        app: tareas-api
    spec:
      containers:
        - name: api
          image: tareas-api:1.0.0
          ports:
            - containerPort: 3000
          # readinessProbe: decide si el Pod recibe tráfico del Service. Si falla,
          # Kubernetes lo saca temporalmente de la rotación sin reiniciarlo.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          # livenessProbe: decide si el Pod está "vivo". Si falla repetidamente,
          # Kubernetes lo reinicia — a diferencia de readiness, que solo lo aísla.
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: tareas-api
spec:
  # ClusterIP (por defecto): el Service solo es alcanzable dentro del cluster.
  # Para tráfico externo real se necesita además un Ingress (Módulo 7).
  type: ClusterIP
  selector:
    app: tareas-api # enruta tráfico a cualquier Pod con esta label — el mismo
                     # selector que usa el Deployment de arriba
  ports:
    - port: 80
      targetPort: 3000
