# Docker Compose y orquestación local (Módulo 3): API + base de datos + caché,
# con healthchecks y dependencias ordenadas de arranque.
name: tareas-app

services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/tareas
      REDIS_URL: redis://cache:6379
    depends_on:
      db:
        # depends_on con `condition` espera a que el healthcheck pase, no solo
        # a que el contenedor arranque — evita que la API intente conectar
        # antes de que Postgres esté realmente listo para aceptar conexiones.
        condition: service_healthy
      cache:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: tareas
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 5

  cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  db-data:
