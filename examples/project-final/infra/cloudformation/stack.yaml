# Infraestructura del Sistema de Gestión de Tareas (Módulo 9), en CloudFormation
# — la misma arquitectura que infra/terraform/, para comparar ambos enfoques
# (ver Módulo 15: Infraestructura como código con CloudFormation).
#
# Uso:
#   floci start   # o: docker compose up -d
#   aws cloudformation deploy \
#     --template-file stack.yaml \
#     --stack-name gestor-tareas \
#     --capabilities CAPABILITY_NAMED_IAM \
#     --endpoint-url http://localhost:4566
#
# Nota: por simplicidad este stack usa el código de las Lambdas embebido con
# ZipFile (útil para handlers pequeños). Para funciones más grandes, sube el
# .zip a S3 primero (aws s3 cp) y referencia Bucket/Key en vez de ZipFile.

AWSTemplateFormatVersion: '2010-09-09'
Description: Sistema de Gestión de Tareas — Módulo 9 (referencia CloudFormation)

Parameters:
  Environment:
    Type: String
    Default: dev

Resources:
  TareasTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub gestor-tareas-tareas-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  AdjuntosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub gestor-tareas-adjuntos-${Environment}

  NotificacionesQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub gestor-tareas-notificaciones-${Environment}

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub gestor-tareas-lambda-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PermisosMinimos
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource: !GetAtt TareasTable.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt NotificacionesQueue.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  ListTasksFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub gestor-tareas-list-tasks-${Environment}
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref TareasTable
      Code:
        ZipFile: |
          const AWS = require('aws-sdk');
          const dynamodb = new AWS.DynamoDB.DocumentClient({ endpoint: process.env.DYNAMODB_ENDPOINT });
          exports.handler = async (event) => {
            const estado = event.queryStringParameters && event.queryStringParameters.estado;
            const params = { TableName: process.env.TABLE_NAME };
            if (estado) {
              params.FilterExpression = 'estado = :estado';
              params.ExpressionAttributeValues = { ':estado': estado };
            }
            const result = await dynamodb.scan(params).promise();
            return {
              statusCode: 200,
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ tareas: result.Items, total: result.Count }),
            };
          };

  CreateTaskFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub gestor-tareas-create-task-${Environment}
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref TareasTable
          QUEUE_URL: !Ref NotificacionesQueue
      Code:
        ZipFile: |
          const AWS = require('aws-sdk');
          const dynamodb = new AWS.DynamoDB.DocumentClient({ endpoint: process.env.DYNAMODB_ENDPOINT });
          const sqs = new AWS.SQS({ endpoint: process.env.SQS_ENDPOINT });
          exports.handler = async (event) => {
            const body = JSON.parse(event.body || '{}');
            if (!body.titulo) {
              return { statusCode: 400, body: JSON.stringify({ error: 'El campo titulo es obligatorio' }) };
            }
            const tarea = {
              id: 'tarea-' + Date.now(),
              titulo: body.titulo,
              descripcion: body.descripcion || '',
              estado: 'pendiente',
              creado: new Date().toISOString(),
            };
            await dynamodb.put({ TableName: process.env.TABLE_NAME, Item: tarea }).promise();
            if (process.env.QUEUE_URL) {
              await sqs.sendMessage({
                QueueUrl: process.env.QUEUE_URL,
                MessageBody: JSON.stringify({ tipo: 'tarea_creada', tareaId: tarea.id }),
              }).promise();
            }
            return { statusCode: 201, body: JSON.stringify(tarea) };
          };

  UpdateTaskFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub gestor-tareas-update-task-${Environment}
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref TareasTable
      Code:
        ZipFile: |
          const AWS = require('aws-sdk');
          const dynamodb = new AWS.DynamoDB.DocumentClient({ endpoint: process.env.DYNAMODB_ENDPOINT });
          exports.handler = async (event) => {
            const id = event.pathParameters && event.pathParameters.id;
            const body = JSON.parse(event.body || '{}');
            const result = await dynamodb.update({
              TableName: process.env.TABLE_NAME,
              Key: { id },
              UpdateExpression: 'SET estado = :estado',
              ExpressionAttributeValues: { ':estado': body.estado },
              ReturnValues: 'ALL_NEW',
            }).promise();
            return { statusCode: 200, body: JSON.stringify(result.Attributes) };
          };

  DeleteTaskFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub gestor-tareas-delete-task-${Environment}
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref TareasTable
      Code:
        ZipFile: |
          const AWS = require('aws-sdk');
          const dynamodb = new AWS.DynamoDB.DocumentClient({ endpoint: process.env.DYNAMODB_ENDPOINT });
          exports.handler = async (event) => {
            const id = event.pathParameters && event.pathParameters.id;
            await dynamodb.delete({ TableName: process.env.TABLE_NAME, Key: { id } }).promise();
            return { statusCode: 204, body: '' };
          };

  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub gestor-tareas-api-${Environment}

  TareasResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: tareas

  TareaIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref TareasResource
      PathPart: '{id}'

  GetTareasMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref TareasResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListTasksFunction.Arn}/invocations

  PostTareasMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref TareasResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateTaskFunction.Arn}/invocations

  PutTareaMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref TareaIdResource
      HttpMethod: PUT
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateTaskFunction.Arn}/invocations

  DeleteTareaMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref TareaIdResource
      HttpMethod: DELETE
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DeleteTaskFunction.Arn}/invocations

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - GetTareasMethod
      - PostTareasMethod
      - PutTareaMethod
      - DeleteTareaMethod
    Properties:
      RestApiId: !Ref RestApi

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RestApi
      DeploymentId: !Ref ApiDeployment
      StageName: !Ref Environment

Outputs:
  ApiInvokeUrl:
    Description: URL base de la API desplegada
    Value: !Sub http://localhost:4566/restapis/${RestApi}/${Environment}/_user_request_
  TableName:
    Value: !Ref TareasTable
  BucketName:
    Value: !Ref AdjuntosBucket
  QueueUrl:
    Value: !Ref NotificacionesQueue
