# CI/CD del Sistema de Gestión de Tareas (Módulo 9) contra Floci.
#
# Levanta Floci como servicio del propio job (sin cuenta AWS real, sin
# secretos que gestionar), despliega la infraestructura con Terraform, y
# ejecuta una prueba de humo contra la API ya desplegada.
#
# Coloca este archivo en .github/workflows/deploy.yml de tu propio repo
# para que GitHub Actions lo recoja automáticamente.

name: Deploy Sistema de Gestión de Tareas (Floci)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias del backend
        working-directory: examples/project-final/backend
        run: npm install --omit=dev

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.0'

      - name: Esperar a que Floci esté listo
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:4566/_localstack/health && break
            sleep 2
          done

      - name: Terraform init
        working-directory: examples/project-final/infra/terraform
        run: terraform init

      - name: Terraform apply
        working-directory: examples/project-final/infra/terraform
        run: terraform apply -auto-approve

      - name: Prueba de humo — crear y listar una tarea
        working-directory: examples/project-final/infra/terraform
        run: |
          API_URL=$(terraform output -raw api_invoke_url)
          echo "API desplegada en: $API_URL"

          curl -sf -X POST "$API_URL/tareas" \
            -H "Content-Type: application/json" \
            -d '{"titulo": "Tarea de CI", "descripcion": "Creada por el pipeline"}' \
            -o /tmp/creada.json
          cat /tmp/creada.json

          curl -sf "$API_URL/tareas" | grep -q "Tarea de CI" || {
            echo "La tarea creada no aparece en el listado"
            exit 1
          }
          echo "Prueba de humo OK: crear + listar funcionan de extremo a extremo."

      - name: Terraform destroy (limpieza)
        if: always()
        working-directory: examples/project-final/infra/terraform
        run: terraform destroy -auto-approve
